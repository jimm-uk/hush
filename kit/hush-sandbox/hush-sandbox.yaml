# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi + local MLX models (on host), generic lightweight sandbox

capabilities:
  - type: com.docker.sandbox/sbx@1

  # The ONLY destination this kit opens: the mlx_lm.server on the host.
  # Everything else is left to your local policy (use the deny-all preset).
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - host.docker.internal:8080
          - localhost:8080   # proxy sees host.docker.internal as localhost

  # Agent instructions live in files/AGENTS.md (copied to ~/.pi/agent/AGENTS.md).
